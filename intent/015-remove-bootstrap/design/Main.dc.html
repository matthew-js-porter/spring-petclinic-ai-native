<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veterinarians without Bootstrap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Varela+Round&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4,p{margin-top:0}
table{border-collapse:collapse}
img{max-width:100%;vertical-align:middle}
button,input,select{font:inherit}
[hidden]{display:none}
a{color:#3f7223}
a:hover{color:#34302d}
.pc-container{width:100%;margin-left:auto;margin-right:auto;padding-left:12px;padding-right:12px}
@media (min-width:576px){.pc-container{max-width:540px}}
@media (min-width:768px){.pc-container{max-width:720px}}
@media (min-width:992px){.pc-container{max-width:960px}}
@media (min-width:1200px){.pc-container{max-width:1140px}}
@media (min-width:1400px){.pc-container{max-width:1320px}}
.pc-brand{color:#ffffff;text-decoration:none}
.pc-brand:hover{color:#ffffff}
.pc-brand:focus-visible,.pc-navbar-toggle:focus-visible,.pc-nav-link:focus-visible{outline:2px solid #6db33f;outline-offset:-2px}
.pc-nav-link{color:#ffffff;text-decoration:none}
.pc-nav-link:hover,.pc-nav-link[aria-current="page"]{background:#3f7223;color:#ffffff}
.pc-navbar-toggle{display:none}
@media (max-width:991.98px){
.pc-navbar-toggle{display:inline-flex}
.pc-navbar-menu{flex-basis:100%}
.pc-js .pc-navbar-menu:not(.pc-open){display:none}
.pc-nav{flex-direction:column}
}
.pc-table tbody tr:nth-child(odd) td{background:#f4f2f0}
.pc-table-region:focus-visible{outline:2px solid #3f7223;outline-offset:2px}
.pc-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.pc-page-link:focus-visible{outline:2px solid #3f7223;outline-offset:2px}
</style>
</helmet>
<div class="pc-js" style="min-height: 900px; display: flex; flex-direction: column; background: #ffffff; color: #34302d; font-family: 'Varela Round', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 1.5;">
<header>
<nav class="pc-navbar" aria-label="Main" onKeyDown="{{onKey}}" style="background: #34302d; border-top: 4px solid #6db33f;">
<div class="pc-container" style="display: flex; flex-wrap: wrap; align-items: center; min-height: 64px;">
<a class="pc-brand" href="#" style="display: flex; align-items: center; gap: 8px; margin-right: auto; padding: 0 4px; height: 64px; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-size: 20px; line-height: 24px; font-weight: 700;">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8.2 3.2 4.5 6.8 4.5c2.1 0 3.7 1.1 5.2 3 1.5-1.9 3.1-3 5.2-3 3.6 0 5.8 3.7 4.3 7.2C19.5 16.4 12 21 12 21z" fill="#6db33f"></path><path d="M10.6 8.5h2.8v2.6H16v2.8h-2.6v2.6h-2.8v-2.6H8v-2.8h2.6z" fill="#34302d"></path></svg>
<span>Spring PetClinic</span>
</a>
<button class="pc-navbar-toggle" type="button" aria-controls="main-navbar" aria-expanded="{{expanded}}" aria-label="Toggle navigation" onClick="{{toggle}}" ref="{{toggleRef}}" style="align-items: center; justify-content: center; width: 56px; height: 64px; padding: 0; border: 0; border-radius: 0; background: transparent; color: #ffffff; cursor: pointer;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
<div class="{{menuClass}}" id="main-navbar">
<ul class="pc-nav" style="display: flex; list-style: none; margin: 0; padding: 0;">
<li><a class="pc-nav-link" href="#" style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 16px; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;">
<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"></path></svg>
<span>Home</span></a></li>
<li><a class="pc-nav-link" href="#" style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 16px; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;">
<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"></path></svg>
<span>Find Owners</span></a></li>
<li><a class="pc-nav-link" href="#" aria-current="page" style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 16px; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;">
<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M5 11.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m-3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg>
<span>Veterinarians</span></a></li>
</ul>
</div>
</div>
</nav>
</header>

<main class="pc-container" style="flex-grow: 1; padding-top: 48px; padding-bottom: 48px;">
<h2 style="margin: 0 0 24px; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-size: 32px; line-height: 38px; font-weight: 700; color: #34302d;">Veterinarians</h2>
<div class="pc-table-region" tabindex="0" role="region" aria-label="Veterinarians" style="overflow-x: auto;">
<table class="pc-table" style="width: 100%; color: #34302d;">
<caption class="pc-sr-only">Veterinarians and their specialties</caption>
<thead>
<tr>
<th scope="col" style="text-align: left; padding: 12px 16px; border-bottom: 2px solid #34302d; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;">Name</th>
<th scope="col" style="text-align: left; padding: 12px 16px; border-bottom: 2px solid #34302d; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;">Specialties</th>
</tr>
</thead>
<tbody>
<sc-for list="{{vets}}" as="vet" hint-placeholder-count="5">
<tr>
<td style="padding: 12px 16px; border-bottom: 1px solid #e0dfdb; white-space: nowrap;">{{vet.name}}</td>
<td style="padding: 12px 16px; border-bottom: 1px solid #e0dfdb;">
<sc-if value="{{vet.hasSpecialties}}" hint-placeholder-val="{{true}}">
<span>{{vet.specialties}}</span>
</sc-if>
<sc-if value="{{vet.noSpecialties}}" hint-placeholder-val="{{false}}">
<span style="color: #5c5752;">none</span>
</sc-if>
</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<nav aria-label="Veterinarian pages" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 24px;">
<span style="color: #5c5752;">Pages:</span>
<span aria-current="page" style="padding: 0 4px;">1</span>
<a class="pc-page-link" href="#" style="padding: 0 4px;">2</a>
<span aria-hidden="true" style="padding: 0 4px; color: #b6b0a8;">«</span>
<span aria-hidden="true" style="padding: 0 4px; color: #b6b0a8;">‹</span>
<a class="pc-page-link" href="#" aria-label="Next page" style="padding: 0 4px;">›</a>
<a class="pc-page-link" href="#" aria-label="Last page" style="padding: 0 4px;">»</a>
</nav>
</main>

<footer style="border-top: 1px solid #e0dfdb; padding: 24px 0; font-size: 14px; line-height: 21px; color: #5c5752;">
<div class="pc-container">Spring PetClinic · a Spring Boot sample application</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false };
  }
  renderVals() {
    const open = this.state.open;
    const vets = [
      { name: 'James Carter', specialties: '' },
      { name: 'Helen Leary', specialties: 'radiology' },
      { name: 'Linda Douglas', specialties: 'dentistry surgery' },
      { name: 'Rafael Ortega', specialties: 'surgery' },
      { name: 'Henry Stevens', specialties: 'radiology' }
    ].map((v) => ({ ...v, hasSpecialties: v.specialties !== '', noSpecialties: v.specialties === '' }));
    return {
      vets: vets,
      expanded: open ? 'true' : 'false',
      menuClass: open ? 'pc-navbar-menu pc-open' : 'pc-navbar-menu',
      toggle: () => this.setState({ open: !this.state.open }),
      toggleRef: (el) => { this.toggleButton = el; },
      onKey: (e) => {
        if (e.key === 'Escape' && this.state.open) {
          this.setState({ open: false });
          if (this.toggleButton) this.toggleButton.focus();
        }
      },
      true: true,
      false: false
    };
  }
}
</script>
</body>
</html>
