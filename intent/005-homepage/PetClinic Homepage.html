<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome · Spring PetClinic</title>
<!-- Design reference for intent 005 (homepage), exported from the PetClinic Homepage design canvas.
     Uses the Spring PetClinic design system (docs/design-system/). Resize the window below 992px to see the collapsed navbar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
	:root {
		--pc-spring-brown: #34302d;
		--pc-spring-green: #6db33f;
		--pc-spring-green-dark: #3f7223;
		--pc-ink: var(--pc-spring-brown);
		--pc-ink-muted: #5c5752;
		--pc-on-dark: #ffffff;
		--pc-surface: #ffffff;
		--pc-line: #e0dfdb;
		--pc-focus-ring: var(--pc-spring-green-dark);
		--pc-focus-ring-on-dark: var(--pc-spring-green);
		--pc-font-display: Montserrat, "Helvetica Neue", Arial, sans-serif;
		--pc-font-body: "Varela Round", "Helvetica Neue", Arial, sans-serif;
		--pc-hero-width: 360px;
	}

	* { box-sizing: border-box; }

	body {
		margin: 0;
		display: flex;
		flex-direction: column;
		min-height: 100vh;
		background: var(--pc-surface);
		color: var(--pc-ink);
		font-family: var(--pc-font-body);
		font-size: 16px;
		line-height: 24px;
	}

	.container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 12px; }

	a:focus-visible, button:focus-visible { outline: 2px solid var(--pc-focus-ring); outline-offset: 2px; }

	/* Navbar */
	.pc-navbar { background: var(--pc-spring-brown); border-top: 4px solid var(--pc-spring-green); }
	.pc-navbar .container { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: space-between; }
	.pc-navbar a:focus-visible, .pc-navbar button:focus-visible { outline: 2px solid var(--pc-focus-ring-on-dark); outline-offset: -2px; }

	.pc-brand {
		display: flex; align-items: center; gap: 8px; min-height: 64px;
		color: var(--pc-on-dark); text-decoration: none;
		font-family: var(--pc-font-display); font-size: 20px; line-height: 24px; font-weight: 700;
	}

	.pc-toggler {
		display: none; align-self: center; width: 56px; height: 44px;
		align-items: center; justify-content: center;
		background: transparent; color: var(--pc-on-dark);
		border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 0; cursor: pointer;
	}

	.pc-nav { list-style: none; margin: 0; padding: 0; display: flex; align-items: stretch; }

	.pc-nav-link {
		display: flex; align-items: center; gap: 4px; min-height: 64px; padding: 0 16px;
		color: var(--pc-on-dark); text-decoration: none;
		font-family: var(--pc-font-display); font-size: 14px; line-height: 20px; font-weight: 600;
		letter-spacing: 0.08em; text-transform: uppercase;
	}
	.pc-nav-link:hover, .pc-nav-link[aria-current="page"] { background: var(--pc-spring-green-dark); color: var(--pc-on-dark); }

	@media (max-width: 991.98px) {
		.pc-toggler { display: flex; }
		.pc-nav { display: none; flex-basis: 100%; flex-direction: column; padding-bottom: 8px; }
		.pc-nav.is-open { display: flex; }
		.pc-nav-link { min-height: 48px; }
	}

	/* Page */
	.pc-main { flex-grow: 1; padding-top: 48px; padding-bottom: 48px; }

	.pc-page-title {
		margin: 0 0 24px;
		font-family: var(--pc-font-display); font-size: 32px; line-height: 38px; font-weight: 700;
		color: var(--pc-ink);
	}

	.pc-hero { display: block; width: var(--pc-hero-width); max-width: 100%; height: auto; margin-top: 24px; }

	/* Footer */
	.pc-footer {
		padding: 24px 0; border-top: 1px solid var(--pc-line); text-align: center;
		font-size: 14px; line-height: 21px; color: var(--pc-ink-muted);
	}
</style>
</head>
<body>
<header>
	<nav class="pc-navbar" aria-label="Main">
		<div class="container">
			<a class="pc-brand" href="#">
				<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
					<path d="M12 21s-7.5-4.6-9.5-9.3C1 8.2 3.2 4.5 6.8 4.5c2.1 0 3.7 1.1 5.2 3 1.5-1.9 3.1-3 5.2-3 3.6 0 5.8 3.7 4.3 7.2C19.5 16.4 12 21 12 21z" fill="#6db33f"/>
					<path d="M10.6 8.5h2.8v2.6H16v2.8h-2.6v2.6h-2.8v-2.6H8v-2.8h2.6z" fill="#34302d"/>
				</svg>
				<span>Spring PetClinic</span>
			</a>
			<button class="pc-toggler" type="button" aria-controls="main-navbar" aria-expanded="false" aria-label="Toggle navigation">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
			</button>
			<ul class="pc-nav" id="main-navbar">
				<li>
					<a class="pc-nav-link" href="#" aria-current="page">
						<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
							<path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
						</svg>
						<span>Home</span>
					</a>
				</li>
				<li>
					<a class="pc-nav-link" href="#">
						<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
							<path fill-rule="evenodd" d="M5 11.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m-3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
						</svg>
						<span>Veterinarians</span>
					</a>
				</li>
			</ul>
		</div>
	</nav>
</header>

<main class="container pc-main">
	<h2 class="pc-page-title">Welcome</h2>
	<img class="pc-hero" src="../../src/main/resources/static/resources/images/pets.png" width="3024" height="4032"
		 alt="A small grey and white long-haired dog lying on its back in a fluffy cream bed, hugging a brown and white stuffed toy dog">
</main>

<footer class="pc-footer">
	<div class="container">Spring PetClinic · a Spring Boot sample application</div>
</footer>

<script>
	// Stand-in for Bootstrap's collapse in this static reference.
	document.querySelector('.pc-toggler').addEventListener('click', function () {
		var open = document.getElementById('main-navbar').classList.toggle('is-open');
		this.setAttribute('aria-expanded', String(open));
	});
</script>
</body>
</html>
