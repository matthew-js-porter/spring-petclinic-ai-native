<!-- @dsCard group="Forms" height=200 subtitle="Empty and filled; square, label above" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FormField — preview</title></head>
<body>
<div class="pc-pad">
  <div class="pc-form">
    <div class="pc-field">
      <label for="lastName">Last Name</label>
      <input class="pc-input" type="search" id="lastName" name="lastName" maxlength="30" autocomplete="off">
    </div>
    <div class="pc-field">
      <label for="lastNameFilled">Last Name</label>
      <input class="pc-input" type="search" id="lastNameFilled" name="lastNameFilled" maxlength="30" autocomplete="off" value="Davis">
    </div>
  </div>
</div>
</body>
</html>
