<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>InlineMessage — preview</title>
<style>.cap { margin: 0 0 var(--space-2); font-size: 14px; line-height: 21px; color: var(--ink-muted); }</style>
</head>
<body>
<div class="pc-pad">
  <p class="cap">Result</p>
  <p class="pc-message" role="status">No owners found with a last name starting with "Dav".</p>
  <p class="cap">Confirmation, after a save</p>
  <p class="pc-message" role="status">New Owner Created</p>
  <p class="cap">Form summary, above a redisplayed form</p>
  <p class="pc-message" role="alert">Owner not saved: 2 fields need attention.</p>
</div>
</body>
</html>
