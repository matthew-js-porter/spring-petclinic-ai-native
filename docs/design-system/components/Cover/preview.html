<!doctype html>
<html lang="en">

<title>Spring PetClinic</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  .brown { fill:var(--spring-brown); }
  .green { fill:var(--spring-green); }
  .dark { fill:var(--spring-green-dark); }
  .tint { fill:var(--surface-stripe); }
  .rule { fill:var(--line); }
  .sq { rx:var(--radius-none); }
  .words { position:absolute; left:48px; bottom:40px; max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:80px; line-height:.95; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:12px 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>

<div class="cover">
