# Advisory evals of the pipeline's skills with the skill-creator plugin. Each skill keeps
# its cases in .claude/skills/<skill>/evals/evals.json. Results never block a merge.
name: skill-evals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".claude/skills/**"
      - "CLAUDE.md"
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to evaluate, e.g. spec"
        required: true
        type: string

permissions: {}

jobs:
  eval:
    # Skip drafts and fork PRs (no secrets on forks).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Eval results or Claude outages must never block merging.
    continue-on-error: true
    concurrency:
      group: skill-evals-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Full history so the skills on origin/main can be compared with this branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "skill-creator@claude-plugins-official"
          # Writes Claude's report (steps, tool calls, denials) to the job summary.
          display_report: true
          prompt: |
            You are running unattended in CI. Nobody can answer questions or open a browser.

            Skills to evaluate: ${{ inputs.skill || 'every skill under .claude/skills/ that has evals/evals.json and changed in this PR (git diff --name-only origin/main...HEAD); all of them if CLAUDE.md changed' }}.

            For each one, run:

            /skill-creator:skill-creator eval <skill>

            - Which copy is which: on a pull request the action restores `.claude/` and `CLAUDE.md` from `origin/main` and keeps the PR's versions under `.claude-pr/`. So when `.claude-pr/.claude/skills/<skill>/` exists, with_skill is `.claude-pr/.claude/skills/<skill>/` (the PR) and old_skill is `.claude/skills/<skill>/` (main). Otherwise with_skill is `.claude/skills/<skill>/` and old_skill is a snapshot from `origin/main` (`git show`); if `origin/main` has no such skill, run with_skill only.
            - Take the evals, `evals.json` and fixtures from the with_skill copy. Where an eval prompt names a path under `.claude/skills/<skill>/`, give each run the same path under its own copy.
            - Run every eval once per configuration.
            - Do not change the skill or any other tracked file, and do not commit or push.
            - This is a non-interactive run: the job ends, and stops any background work, as soon as your turn ends. Spawn every eval run and grader as a foreground subagent (never in the background) and wait for all of them before you aggregate, render and finish.
            - Use simple Bash commands: one command per call, no shell variables, loops or brace expansion (they need approval and will be denied). skill-creator's scripts are under `~/.claude/plugins/`.
            - Put the workspace at `skill-evals/<skill>-workspace/` in the repository root (not under `.claude/`, which is write-protected), and keep every result there.
            - Use exactly this layout, which skill-creator's `aggregate_benchmark.py` reads: `skill-evals/<skill>-workspace/iteration-1/eval-<name>/eval_metadata.json`, and per configuration (`with_skill`, `old_skill`) `eval-<name>/<config>/run-1/` holding `outputs/`, `timing.json` (from the subagent's completion notice: total_tokens, duration_ms, total_duration_seconds) and `grading.json`. Leave the `timing` block out of `grading.json` so the script reads `timing.json`.
            - After `aggregate_benchmark.py`, set `executor_model` and `analyzer_model` in `benchmark.json` to your model ID and `runs_per_configuration` to 1, and correct the same two facts in the header of `benchmark.md`.
            - Do not start the viewer server: write it with `--static skill-evals/<skill>-workspace/review.html`.
            ${{ github.event.pull_request.number && format('- When every skill is done, post one comment on PR #{0} with `gh pr comment {0} --body-file <file>`: a table per skill (eval, old_skill pass rate, with_skill pass rate, change), the expectations that failed with one line of evidence each, and a link to {1}/{2}/actions/runs/{3} for the full review pages. Say that the evals are advisory.', github.event.pull_request.number, github.server_url, github.repository, github.run_id) || '- Finish with the same table and failed expectations as your final message.' }}
          claude_args: >-
            --max-turns 200
            --add-dir /home/runner/.claude/plugins
            --allowedTools "Skill,Task,Agent,Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(cd:*),Bash(python:*),Bash(python3:*),Bash(mkdir:*),Bash(cp:*),Bash(ls:*),Bash(wc:*),Bash(grep:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(diff:*),Bash(find:*),Bash(sort:*),Bash(tar:*),Bash(gh pr comment:*)"

      # Never publish results that contain the token.
      - name: Check results for the token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if grep -rqF -- "$TOKEN" skill-evals "$RUNNER_TEMP/claude-execution-output.json" 2>/dev/null; then
            echo "::error::The Claude token appears in the eval results; not uploading them."
            exit 1
          fi

      # skill-creator's benchmark.md per skill: pass rates, time and tokens per configuration.
      - name: Add results to the job summary
        run: |
          found=0
          while IFS= read -r f; do
            found=1
            { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done < <(find skill-evals -name benchmark.md 2>/dev/null | sort)
          if [ "$found" = 0 ]; then
            echo "No skill-creator benchmark was produced; see the Claude Code Report above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: skill-evals
          path: |
            skill-evals/
            ${{ runner.temp }}/claude-execution-output.json
          retention-days: 90
          if-no-files-found: error
