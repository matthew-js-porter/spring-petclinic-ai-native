# F6: weekly, turn confirmed Snyk and Sonar findings from the latest main scans into new intents via one PR.
name: triage-findings

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the weekly snyk run at 03:00
  workflow_dispatch:

permissions: {}

concurrency:
  group: triage-findings
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          # The fetch script uses the job's token (actions: read) to download the Snyk artifact.
          SNYK_ARTIFACT_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /triage-findings

            You are running unattended in CI as the Maintain stage. Nobody can answer questions.

            After the skill has written its intents:
            - If at least one intent was written: create branch `maintain/findings-<today's UTC date as YYYY-MM-DD>` from `main`, commit only the new intent.md files with message "Add intents from Snyk and Sonar findings on main", push it, and open one PR into `main` with `gh pr create`, titled "Maintain: findings <same date>". Put the skill's sources line and its confirmed and dismissed tables in the body.
            - If nothing was confirmed, do not create a branch or PR. Print the skill's report instead.
            Never push to `main`.
          claude_args: >-
            --max-turns 50
            --allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(.claude/skills/triage-findings/scripts/fetch-results.sh),Bash(jq:*),Bash(date:*),Read,Write,Edit,Glob,Grep,Skill"
