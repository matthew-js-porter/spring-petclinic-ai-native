# F1-F4: SonarQube Cloud analysis with JaCoCo coverage on every push to main and every PR,
# and a check that fails when the quality gate does.
name: sonar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # SONAR_TOKEN is withheld from fork PRs, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for blame and new-code detection.
          fetch-depth: 0
          persist-credentials: false

      # Analyse on the same JDK as the build.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
          cache: maven

      - name: Build, test and analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  quality-gate:
    needs: analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The project is public, so the gate is read without SONAR_TOKEN.
      - uses: sonarcloud-actions/sonarcloud-check-status-action@v1 # NOSONAR githubactions:S7637: CLAUDE.md requires version tags, never commit SHAs
