# F6: weekly, turn confirmed Snyk findings from the latest main scan into new intents via one PR.
name: maintain-scan

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the weekly snyk run at 03:00
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintain-scan
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download latest Snyk results from main
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --repo "$REPO" --workflow snyk.yml --branch main --status completed \
            --limit 20 --json databaseId,event \
            --jq '[.[] | select(.event != "pull_request")][0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::No completed snyk run on main found."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .snyk-results
          echo ".snyk-results/" >> .git/info/exclude
          if ! gh run download "$run_id" --repo "$REPO" -n snyk-sarif -D .snyk-results; then
            echo "::warning::Snyk run $run_id has no snyk-sarif artifact."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(jq -s '[.[].runs[]?.results[]?] | length' .snyk-results/*.sarif)
          echo "Snyk run $run_id: $count finding(s)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Prepare branch and next intent number
        id: prep
        if: steps.download.outputs.count != '0'
        run: |
          last=$(find intent -maxdepth 1 -type d -name '[0-9][0-9][0-9]-*' -exec basename {} \; | cut -c1-3 | sort -n | tail -1)
          printf 'next=%03d\n' "$((10#${last:-000} + 1))" >> "$GITHUB_OUTPUT"
          echo "branch=maintain/security-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.download.outputs.count != '0'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /maintain-scan .snyk-results https://github.com/${{ github.repository }}/actions/runs/${{ steps.download.outputs.run_id }} ${{ steps.prep.outputs.next }}

            You are running unattended in CI as the Maintain stage. Nobody can answer questions.
            `.snyk-results/` holds ${{ steps.download.outputs.count }} result(s) from Snyk run ${{ steps.download.outputs.run_id }} on `main`.

            After the skill has written its intents:
            - If at least one intent was written: create branch `${{ steps.prep.outputs.branch }}` from `main`, commit only the new intent.md files (never `.snyk-results/`) with message "Add security intents from Snyk run ${{ steps.download.outputs.run_id }}", push it, and open one PR into `main` with `gh pr create`, titled "Maintain: security findings ${{ steps.prep.outputs.branch }}". Put the skill's confirmed and dismissed tables in the body.
            - If nothing was confirmed, do not create a branch or PR. Print the dismissed table instead.
            Never push to `main`.
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(jq:*),Read,Write,Edit,Glob,Grep,Skill"
