<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<body>
<!--/* Plain-text page control: "Pages: [ 1 2 ] « ‹ › »". `page` is a Spring Data Page, `url` the list URL. */-->
<nav th:fragment="pagination (page, url, label)" th:if="${page.totalPages > 1}"
	 class="pc-pagination" th:aria-label="${label}"
	 th:with="current=${page.number + 1}, last=${page.totalPages}">
	<span class="pc-pagination-label">Pages:</span>
	<span aria-hidden="true">[</span>
	<th:block th:each="n : ${#numbers.sequence(1, last)}">
		<span th:if="${n == current}" aria-current="page" th:text="${n}">1</span>
		<a th:unless="${n == current}" th:href="@{${url}(page=${n})}" th:aria-label="|Page ${n}|" th:text="${n}">2</a>
	</th:block>
	<span aria-hidden="true">]</span>
	<span class="pc-pagination-steps">
		<a th:if="${page.hasPrevious()}" class="pc-step" th:href="@{${url}(page=1)}" title="First" aria-label="First page">&laquo;</a>
		<span th:unless="${page.hasPrevious()}" class="pc-disabled" aria-disabled="true" title="First">&laquo;</span>
		<a th:if="${page.hasPrevious()}" class="pc-step" th:href="@{${url}(page=${current - 1})}" title="Previous" aria-label="Previous page">&lsaquo;</a>
		<span th:unless="${page.hasPrevious()}" class="pc-disabled" aria-disabled="true" title="Previous">&lsaquo;</span>
		<a th:if="${page.hasNext()}" class="pc-step" th:href="@{${url}(page=${current + 1})}" title="Next" aria-label="Next page">&rsaquo;</a>
		<span th:unless="${page.hasNext()}" class="pc-disabled" aria-disabled="true" title="Next">&rsaquo;</span>
		<a th:if="${page.hasNext()}" class="pc-step" th:href="@{${url}(page=${last})}" title="Last" aria-label="Last page">&raquo;</a>
		<span th:unless="${page.hasNext()}" class="pc-disabled" aria-disabled="true" title="Last">&raquo;</span>
	</span>
</nav>
</body>
</html>
