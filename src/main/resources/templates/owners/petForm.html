<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{fragments/layout :: layout(${heading}, 'owners', ~{::content})}">
<body>
<th:block th:fragment="content">
	<h2 class="pc-page-title" th:text="${heading}">New Pet</h2>

	<p class="pc-muted">Owner: <span th:text="${ownerName}">George Franklin</span></p>

	<p th:if="${#fields.hasErrors('${petForm.*}')}" class="pc-message" role="alert"
	   th:with="count=${#lists.size(#fields.detailedErrors('${petForm.*}'))}"
	   th:text="${count == 1} ? 'Pet not saved: 1 field needs attention.' : |Pet not saved: ${count} fields need attention.|">
		Pet not saved: 2 fields need attention.</p>

	<form method="post" th:action="@{${action}}" th:object="${petForm}" novalidate class="pc-form pc-form-stacked">
		<p class="pc-form-help">All fields are required.</p>
		<div th:replace="~{owners/ownerForm :: field('name', 'Name', 'text', 30, 'off')}"></div>

		<div class="pc-field" th:with="invalid=${#fields.hasErrors('birthDate')}"
			 th:classappend="${invalid} ? 'pc-field-invalid'">
			<label for="birthDate">Birth Date</label>
			<input type="date" th:field="*{birthDate}" th:max="${today}" autocomplete="off" required
				   aria-required="true" th:aria-invalid="${invalid} ? 'true' : null"
				   th:aria-describedby="${invalid} ? 'birthDate-help birthDate-error' : 'birthDate-help'"
				   class="pc-input">
			<p id="birthDate-help" class="pc-field-help">yyyy-mm-dd</p>
			<p th:if="${invalid}" id="birthDate-error" class="pc-field-error" th:errors="*{birthDate}">Birth Date is
				required.</p>
		</div>

		<div class="pc-field" th:with="invalid=${#fields.hasErrors('typeId')}"
			 th:classappend="${invalid} ? 'pc-field-invalid'">
			<label for="typeId">Type</label>
			<select th:field="*{typeId}" required aria-required="true" th:aria-invalid="${invalid} ? 'true' : null"
					th:aria-describedby="${invalid} ? 'typeId-error' : null" class="pc-input">
				<option value="">Select a type</option>
				<option th:each="type : ${petTypes}" th:value="${type.id}" th:text="${type.name}">cat</option>
			</select>
			<p th:if="${invalid}" id="typeId-error" class="pc-field-error" th:errors="*{typeId}">Type is required.</p>
		</div>

		<button type="submit" class="pc-button" th:text="${submitLabel}">Add Pet</button>
	</form>
</th:block>
</body>
</html>
