<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{fragments/layout :: layout('New Visit', 'owners', ~{::content})}">
<body>
<th:block th:fragment="content">
	<h2 class="pc-page-title">New Visit</h2>

	<dl class="pc-detail pc-context">
		<div>
			<dt>Pet</dt>
			<dd th:text="${petName}">Samantha</dd>
		</div>
		<div>
			<dt>Type</dt>
			<dd th:text="${petType}">cat</dd>
		</div>
		<div>
			<dt>Owner</dt>
			<dd th:text="${ownerName}">Jean Coleman</dd>
		</div>
	</dl>

	<p th:if="${#fields.hasErrors('${visitForm.*}')}" class="pc-message" role="alert"
	   th:with="count=${#lists.size(#fields.detailedErrors('${visitForm.*}'))}"
	   th:text="${count == 1} ? 'Visit not saved: 1 field needs attention.' : |Visit not saved: ${count} fields need attention.|">
		Visit not saved: 2 fields need attention.</p>

	<form method="post" th:action="@{${action}}" th:object="${visitForm}" novalidate class="pc-form pc-form-stacked">
		<p class="pc-form-help">All fields are required.</p>

		<div class="pc-field" th:with="invalid=${#fields.hasErrors('date')}"
			 th:classappend="${invalid} ? 'pc-field-invalid'">
			<label for="date" class="form-label">Date</label>
			<input type="date" th:field="*{date}" autocomplete="off" required aria-required="true"
				   th:aria-invalid="${invalid} ? 'true' : null"
				   th:aria-describedby="${invalid} ? 'date-help date-error' : 'date-help'"
				   class="form-control pc-input">
			<p id="date-help" class="pc-field-help">yyyy-mm-dd</p>
			<p th:if="${invalid}" id="date-error" class="pc-field-error" th:errors="*{date}">Date is required.</p>
		</div>

		<div th:replace="~{owners/ownerForm :: field('description', 'Description', 'text', 255, 'off')}"></div>

		<button type="submit" class="btn pc-button">Add Visit</button>
	</form>

	<h3 class="pc-section-title">Previous Visits</h3>

	<th:block th:replace="~{owners/visitList :: visits(${petName}, ${visits})}"></th:block>
</th:block>
</body>
</html>
