<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{fragments/layout :: layout(${heading}, 'owners', ~{::content})}">
<body>
<th:block th:fragment="content">
	<h2 class="pc-page-title" th:text="${heading}">New Owner</h2>

	<p th:if="${#fields.hasErrors('${ownerForm.*}')}" class="pc-message" role="alert"
	   th:with="count=${#lists.size(#fields.detailedErrors('${ownerForm.*}'))}"
	   th:text="${count == 1} ? 'Owner not saved: 1 field needs attention.' : |Owner not saved: ${count} fields need attention.|">
		Owner not saved: 2 fields need attention.</p>

	<form method="post" th:action="@{${action}}" th:object="${ownerForm}" novalidate class="pc-form pc-form-stacked">
		<p class="pc-form-help">All fields are required.</p>
		<div th:replace="~{owners/ownerForm :: field('firstName', 'First Name', 'text', 30, 'given-name')}"></div>
		<div th:replace="~{owners/ownerForm :: field('lastName', 'Last Name', 'text', 30, 'family-name')}"></div>
		<div th:replace="~{owners/ownerForm :: field('address', 'Address', 'text', 255, 'street-address')}"></div>
		<div th:replace="~{owners/ownerForm :: field('city', 'City', 'text', 80, 'address-level2')}"></div>
		<div th:replace="~{owners/ownerForm :: field('telephone', 'Telephone', 'tel', 10, 'tel-national')}"></div>
		<button type="submit" class="btn pc-button" th:text="${submitLabel}">Add Owner</button>
	</form>
</th:block>

<div th:fragment="field(name, label, type, maxlength, autocomplete)" class="pc-field"
	 th:with="invalid=${#fields.hasErrors(name)}" th:classappend="${invalid} ? 'pc-field-invalid'">
	<label th:for="${name}" class="form-label" th:text="${label}">First Name</label>
	<input th:type="${type}" th:field="*{__${name}__}" th:maxlength="${maxlength}" th:autocomplete="${autocomplete}"
		   th:inputmode="${type == 'tel'} ? 'numeric' : null" required aria-required="true"
		   th:aria-invalid="${invalid} ? 'true' : null" th:aria-describedby="${invalid} ? |${name}-error| : null"
		   class="form-control pc-input">
	<p th:if="${invalid}" th:id="|${name}-error|" class="pc-field-error" th:errors="*{__${name}__}">First Name is
		required.</p>
</div>
</body>
</html>
