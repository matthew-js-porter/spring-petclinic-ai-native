<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{fragments/layout :: layout(${heading}, 'owners', ~{::content})}">
<body>
<th:block th:fragment="content">
	<h2 class="pc-page-title" th:text="${heading}">New Owner</h2>

	<p th:replace="~{fragments/form :: errorSummary('ownerForm', 'Owner')}"></p>

	<form method="post" th:action="@{${action}}" th:object="${ownerForm}" novalidate class="pc-form pc-form-stacked">
		<p class="pc-form-help">All fields are required.</p>
		<div th:replace="~{fragments/form :: field('firstName', 'First Name', 'text', 30, 'given-name')}"></div>
		<div th:replace="~{fragments/form :: field('lastName', 'Last Name', 'text', 30, 'family-name')}"></div>
		<div th:replace="~{fragments/form :: field('address', 'Address', 'text', 255, 'street-address')}"></div>
		<div th:replace="~{fragments/form :: field('city', 'City', 'text', 80, 'address-level2')}"></div>
		<div th:replace="~{fragments/form :: field('telephone', 'Telephone', 'tel', 10, 'tel-national')}"></div>
		<button type="submit" class="btn pc-button" th:text="${submitLabel}">Add Owner</button>
	</form>
</th:block>
</body>
</html>
