<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<body>
<th:block th:fragment="visits(petName, list)">
	<p th:if="${#lists.isEmpty(list)}" class="pc-muted pc-empty">This pet has no visits.</p>

	<table th:unless="${#lists.isEmpty(list)}" class="pc-table pc-visits">
		<caption class="pc-sr-only" th:text="|Visits of ${petName}|">Visits of Samantha</caption>
		<thead>
		<tr>
			<th scope="col">Date</th>
			<th scope="col">Description</th>
		</tr>
		</thead>
		<tbody>
		<tr th:each="visit : ${list}">
			<td class="pc-col-date" th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}">2013-01-04</td>
			<td th:text="${visit.description}">spayed</td>
		</tr>
		</tbody>
	</table>
</th:block>
</body>
</html>
