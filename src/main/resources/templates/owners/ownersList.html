<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{fragments/layout :: layout('Owners', 'owners', ~{::content})}">
<body>
<th:block th:fragment="content">
	<h2 class="pc-page-title">Owners</h2>

	<form method="get" th:action="@{/owners.html}" role="search" class="pc-form">
		<div class="pc-field">
			<label for="lastName" class="form-label">Last Name</label>
			<input type="search" id="lastName" name="lastName" maxlength="30" autocomplete="off"
				   class="form-control pc-input" th:value="${lastName}">
		</div>
		<button type="submit" class="btn pc-button">Find Owner</button>
	</form>

	<p th:if="${listOwners.totalElements == 0}" class="pc-message" role="status"
	   th:text="${#strings.isEmpty(lastName)} ? 'No owners found.' : |No owners found with a last name starting with &quot;${lastName}&quot;.|">
		No owners found.</p>

	<th:block th:if="${listOwners.totalElements > 0}">
		<div class="table-responsive pc-table-region" tabindex="0" role="region" aria-label="Owners table">
			<table id="owners" class="table table-striped pc-table">
				<caption class="visually-hidden"
						 th:with="pages=|page ${listOwners.number + 1} of ${listOwners.totalPages > 0 ? listOwners.totalPages : 1}|"
						 th:text="${#strings.isEmpty(lastName)} ? |Owners and their pets, ${pages}| : |Owners with last name starting with &quot;${lastName}&quot;, ${pages}|">
					Owners and their pets</caption>
				<thead>
				<tr>
					<th scope="col">Name</th>
					<th scope="col">Address</th>
					<th scope="col">City</th>
					<th scope="col">Telephone</th>
					<th scope="col">Pets</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="owner : ${listOwners.content}">
					<td th:text="|${owner.firstName} ${owner.lastName}|">George Franklin</td>
					<td th:text="${owner.address}">110 W. Liberty St.</td>
					<td th:text="${owner.city}">Madison</td>
					<td class="text-nowrap" th:text="${owner.telephone}">6085551023</td>
					<td th:if="${#lists.isEmpty(owner.pets)}" class="pc-muted">none</td>
					<td th:unless="${#lists.isEmpty(owner.pets)}"
						th:text="${#strings.listJoin(owner.pets.![name], ' ')}">Leo</td>
				</tr>
				</tbody>
			</table>
		</div>

		<nav th:replace="~{fragments/pagination :: pagination(${listOwners}, '/owners.html', 'Owners pages', ${lastName})}"></nav>
	</th:block>
</th:block>
</body>
</html>
