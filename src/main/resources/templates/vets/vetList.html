<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{fragments/layout :: layout('Veterinarians', 'vets', ~{::content})}">
<body>
<th:block th:fragment="content">
	<h2 class="pc-page-title">Veterinarians</h2>

	<table id="vets" class="table table-striped pc-table">
		<caption class="visually-hidden"
				 th:text="|Veterinarians and their specialties, page ${listVets.number + 1} of ${listVets.totalPages > 0 ? listVets.totalPages : 1}|">
			Veterinarians and their specialties</caption>
		<thead>
		<tr>
			<th scope="col" class="pc-col-name">Name</th>
			<th scope="col">Specialties</th>
		</tr>
		</thead>
		<tbody>
		<tr th:each="vet : ${listVets.content}">
			<td th:text="|${vet.firstName} ${vet.lastName}|">James Carter</td>
			<td th:if="${#lists.isEmpty(vet.specialties)}" class="pc-muted">none</td>
			<td th:unless="${#lists.isEmpty(vet.specialties)}"
				th:text="${#strings.listJoin(vet.specialties.![name], ' ')}">dentistry surgery</td>
		</tr>
		</tbody>
	</table>

	<nav th:replace="~{fragments/pagination :: pagination(${listVets}, '/vets.html', 'Vets pages')}"></nav>
</th:block>
</body>
</html>
